<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); font-style: normal; font-weight: 400; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-italic-400.woff2") format("woff2"); font-style: italic; font-weight: 400; }
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/BricolageGrotesque-normal-800.woff2") format("woff2"); font-weight: 800; }
      :root {
        --ground: #121211;
        --ink: #f3f1ec;
        --orange: #ff5f1f;
        --muted: #a8a29b;
        --font-display: "Instrument Serif", serif;
        --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; color: var(--ink); font-family: var(--font-body); overflow: hidden; }

      /* Fundo: grade e brilho laranja */
      #grid { position: absolute; inset: -200px; background-image: linear-gradient(rgba(243,241,236,.06) 2px, transparent 2px), linear-gradient(90deg, rgba(243,241,236,.06) 2px, transparent 2px); background-size: 120px 120px; }
      #glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: -300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,95,31,.32), transparent 62%); }

      .logo { position: absolute; top: 220px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 14px; font: 800 52px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -2px; }
      .logo i { width: 20px; height: 20px; background: var(--orange); border-radius: 4px; transform: rotate(45deg); }

      .scene { position: absolute; left: 90px; right: 90px; top: 420px; height: 860px; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
      .big { font: 400 150px/0.95 var(--font-display); letter-spacing: -3px; }
      .big em { font-style: italic; color: var(--orange); }
      .sub { font: 500 46px/1.3 var(--font-body); color: var(--muted); }

      .code { background: #1f1e1c; border: 3px solid #33312d; border-radius: 36px; padding: 44px 46px; font: 500 40px/1.6 "JetBrains Mono", monospace; color: var(--ink); }
      .code b { color: var(--orange); font-weight: 500; }
      .chip { align-self: flex-start; background: var(--orange); color: #fff; border-radius: 60px; padding: 18px 36px; font: 700 34px var(--font-body); letter-spacing: 6px; }

      .list { display: flex; flex-direction: column; border-top: 3px solid rgba(243,241,236,.18); }
      .row { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0; border-bottom: 3px solid rgba(243,241,236,.18); font: 600 46px var(--font-body); }
      .row b { font: 400 64px/1 var(--font-display); color: var(--orange); }

      .gem { width: 200px; height: 200px; border-radius: 40px; background: var(--orange); align-self: center; }
      .cta { align-self: stretch; background: var(--ink); color: var(--ground); border-radius: 40px; padding: 46px 50px; text-align: center; }
      .cta small { display: block; font: 700 32px var(--font-body); letter-spacing: 8px; color: #d9480f; margin-bottom: 10px; }
      .cta strong { display: block; font: 800 150px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -5px; }
      .cta span { display: block; margin-top: 12px; font: 500 40px var(--font-body); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="grid"></div>
        <div id="glow"></div>
        <div class="logo"><i></i>pattiners</div>
      </div>

      <!-- 1. Gancho (0 a 2,6 s) -->
      <div id="s1" class="clip scene" data-start="0" data-duration="2.6" data-track-index="1">
        <div id="s1-title" class="big">O Claude fez <em>este vídeo.</em></div>
        <div id="s1-sub" class="sub">Sem editor. Só código.</div>
      </div>

      <!-- 2. Como (2,6 a 5,4 s) -->
      <div id="s2" class="clip scene" data-start="2.6" data-duration="2.8" data-track-index="1">
        <div id="s2-chip" class="chip">HYPERFRAMES</div>
        <div id="s2-title" class="big">HTML vira <em>MP4.</em></div>
        <div id="s2-code" class="code"><b>$</b> npx skills add<br>heygen-com/hyperframes</div>
      </div>

      <!-- 3. Lista (5,4 a 9 s) -->
      <div id="s3" class="clip scene" data-start="5.4" data-duration="3.6" data-track-index="1">
        <div id="s3-title" class="big" style="font-size:120px">7 skills <em>que testei</em></div>
        <div class="list">
          <div class="row" id="r1"><span>HyperFrames</span><b>01</b></div>
          <div class="row" id="r2"><span>Remotion</span><b>02</b></div>
          <div class="row" id="r3"><span>GSAP</span><b>03</b></div>
          <div class="row" id="r4"><span>Three.js</span><b>04</b></div>
          <div class="row" id="r5"><span>Motion Design</span><b>05</b></div>
          <div class="row" id="r6"><span>Design DNA</span><b>06</b></div>
          <div class="row" id="r7"><span>Genjutsu</span><b>07</b></div>
        </div>
      </div>

      <!-- 4. Chamada (9 a 12 s) -->
      <div id="s4" class="clip scene" data-start="9" data-duration="3" data-track-index="1">
        <div id="s4-gem" class="gem"></div>
        <div id="s4-cta" class="cta"><small>COMENTE</small><strong>SKILLS</strong><span>e receba os 7 links e o teste</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const e = "power3.out";

      tl.fromTo("#grid", { x: 0, y: 0 }, { x: -120, y: -120, duration: 12, ease: "none" }, 0);
      tl.fromTo("#glow", { scale: 0.9, opacity: 0.7 }, { scale: 1.1, opacity: 1, duration: 12, ease: "sine.inOut" }, 0);

      // 1. Gancho: texto já visível no frame 0 (capa do Reels), entra em movimento sutil
      tl.fromTo("#s1-title", { y: 30, opacity: 1 }, { y: 0, duration: 0.8, ease: e }, 0);
      tl.fromTo("#s1-sub", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: e }, 0.5);
      tl.to(["#s1-title", "#s1-sub"], { y: -60, opacity: 0, duration: 0.35, ease: "power2.in" }, 2.2);

      // 2. HyperFrames
      tl.fromTo("#s2-chip", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 2.65);
      tl.fromTo("#s2-title", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: e }, 2.8);
      tl.fromTo("#s2-code", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: e }, 3.1);
      tl.to(["#s2-chip", "#s2-title", "#s2-code"], { x: -140, opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.04 }, 5.0);

      // 3. Lista em cascata
      tl.fromTo("#s3-title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: e }, 5.45);
      tl.fromTo("#s3 .row", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: e, stagger: 0.22 }, 5.8);
      tl.to(["#s3-title", "#s3 .row"], { y: -50, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.65);

      // 4. Chamada final
      tl.fromTo("#s4-gem", { scale: 0, rotation: -180 }, { scale: 1, rotation: 45, duration: 0.7, ease: "back.out(1.8)" }, 9.05);
      tl.fromTo("#s4-cta", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: e }, 9.4);
      tl.fromTo("#s4-cta strong", { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(2)" }, 9.6);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
